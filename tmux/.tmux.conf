# Prefix key
unbind C-b
set-option -g prefix C-Space
bind-key C-Space send-prefix

# misc
set-option -g focus-events on
set -gq allow-passthrough on
set -g visual-activity off
set-option -g terminal-features 'xterm*:clipboard:ccolour:cstyle:focus:title,screen*:title,rxvt*:ignorefkeys,xterm-256color:RGB,tmux-256color:RGB'

# Extended keys
set -g extended-keys-format csi-u
set -g extended-keys on

# Vi mode
set-window-option -g mode-keys vi
bind-key -T copy-mode-vi v send -X begin-selection
bind-key -T copy-mode-vi V send -X select-line
bind-key -T copy-mode-vi y send -X copy-pipe-and-cancel 'pbcopy'

# Status Bar
set -g status on
set -g status-position bottom
set -g status-justify left

# Status left: session name
set -g status-left-length 30

# Status right: date/time
set -g status-right-length 50

# Solarized Light — high contrast at lower display brightness
set -g default-terminal "tmux-256color"
set -g status-style "bg=#eee8d5,fg=#40565c"
set -g status-left "#[bold,bg=#c8d7d4,fg=#263f45] #S #[nobold,bg=#eee8d5,fg=#c8d7d4] "
set -g status-right "#[bg=#eee8d5,fg=#52676d] %Y-%m-%d #[bold,bg=#d8d1bd,fg=#604d16] %H:%M "
set -g window-status-style "bg=#eee8d5,fg=#657b83"
set -g window-status-format " #I:#W "
set -g window-status-current-style "bold,bg=#006a96,fg=#fdf6e3"
set -g window-status-current-format " #I:#W#{?window_zoomed_flag, [Z],} "
set -g window-status-last-style "bg=#eee8d5,fg=#526a38"
set -g window-status-activity-style "bold,bg=#ded7c3,fg=#725800"
set -g window-status-bell-style "bold,bg=#c23b22,fg=#fdf6e3"
set -g pane-border-style "fg=#c4bdab"
set -g pane-active-border-style "fg=#006a96"
set -g message-style "bg=#d8d1bd,fg=#263f45"
set -g message-command-style "bold,bg=#d8d1bd,fg=#006a96"
set -g mode-style "bold,bg=#c8d7d4,fg=#263f45"
set -g clock-mode-colour "#607400"
set -g display-panes-colour "#963e82"
set -g display-panes-active-colour "#006a96"
# Vim-style pane navigation
bind -r h select-pane -L
bind -r j select-pane -D
bind -r k select-pane -U
bind -r l select-pane -R

# Plugins
set-environment -g TMUX_PLUGIN_MANAGER_PATH '~/.tmux/plugins'
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-pain-control'
set -g @plugin 'bjesus/muxile'

run '~/.tmux/plugins/tpm/tpm'
