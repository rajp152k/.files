# Prefix key
unbind C-b
set-option -g prefix C-Space
bind-key C-Space send-prefix

# misc
set-option -g focus-events on
set -gq allow-passthrough on
set -g visual-activity off
set-option -g terminal-features 'xterm*:clipboard:ccolour:cstyle:focus:title,screen*:title,rxvt*:ignorefkeys,xterm-256color:RGB,tmux-256color:RGB'

# Extended keys
set -g extended-keys-format csi-u
set -g extended-keys on

# Vi mode
set-window-option -g mode-keys vi
bind-key -T copy-mode-vi v send -X begin-selection
bind-key -T copy-mode-vi V send -X select-line
bind-key -T copy-mode-vi y send -X copy-pipe-and-cancel 'pbcopy'

# Status Bar
set -g status on
set -g status-position bottom
set -g status-justify left

# Status left: session name
set -g status-left-length 30

# Status right: date/time
set -g status-right-length 50

# Modern neutral dark — crisp without neon or ornamental powerline styling
set -g default-terminal "tmux-256color"
set -g status-style "bg=#0b0d10,fg=#9aa7b2"
set -g status-left "#[bold,bg=#181d23,fg=#ffffff] #S #[nobold,bg=#0b0d10,fg=#293341] "
set -g status-right "#[bg=#0b0d10,fg=#9aa7b2] %Y-%m-%d #[bold,bg=#181d23,fg=#e6edf3] %H:%M "
set -g window-status-style "bg=#0b0d10,fg=#6e7681"
set -g window-status-format " #I:#W "
set -g window-status-current-style "bold,bg=#293341,fg=#ffffff"
set -g window-status-current-format " #I:#W#{?window_zoomed_flag, [Z],} "
set -g window-status-last-style "bg=#0b0d10,fg=#7ee787"
set -g window-status-activity-style "bold,bg=#181d23,fg=#e3b341"
set -g window-status-bell-style "bold,bg=#ff7b72,fg=#0b0d10"
set -g pane-border-style "fg=#293341"
set -g pane-active-border-style "fg=#58a6ff"
set -g message-style "bg=#181d23,fg=#e6edf3"
set -g message-command-style "bold,bg=#181d23,fg=#58a6ff"
set -g mode-style "bold,bg=#293341,fg=#ffffff"
set -g clock-mode-colour "#7ee787"
set -g display-panes-colour "#bc8cff"
set -g display-panes-active-colour "#58a6ff"
# Vim-style pane navigation
bind -r h select-pane -L
bind -r j select-pane -D
bind -r k select-pane -U
bind -r l select-pane -R

# btop
bind-key i display-popup -w 80% -h 80% -E btop

# quick edits
bind-key W display-popup -w 80% -h 80% -E -d ~/source/jour/ just day

# reload config
bind-key r source-file ~/.tmux.conf

# tmux popup
bind-key Enter display-popup -w 80% -h 80% -E -d ~/source 'tmux a -t hq || tmux new -s hq'

# Plugins
set-environment -g TMUX_PLUGIN_MANAGER_PATH '~/.tmux/plugins'
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-pain-control'
set -g @plugin 'bjesus/muxile'

run '~/.tmux/plugins/tpm/tpm'
