# Prefix key
unbind C-b
set-option -g prefix C-Space
bind-key C-Space send-prefix

# misc
set-option -g focus-events on
set -gq allow-passthrough on
set -g visual-activity off
set-option -g terminal-features 'xterm*:clipboard:ccolour:cstyle:focus:title,screen*:title,rxvt*:ignorefkeys,xterm-256color:RGB,tmux-256color:RGB'

# Extended keys
set -g extended-keys-format csi-u
set -g extended-keys on

# Vi mode
set-window-option -g mode-keys vi
bind-key -T copy-mode-vi v send -X begin-selection
bind-key -T copy-mode-vi V send -X select-line
bind-key -T copy-mode-vi y send -X copy-pipe-and-cancel 'pbcopy'

# Status Bar
set -g status on
set -g status-position bottom
set -g status-justify left

# Status left: session name
set -g status-left-length 30

# Status right: date/time
set -g status-right-length 50

# High-contrast green on black.
set -g default-terminal "tmux-256color"
set -g status-style "bg=#000000,fg=#00ff00"
set -g status-left "#[bold,bg=#00ff00,fg=#000000] #S #[nobold,bg=#000000,fg=#006600]│"
set -g status-right "#[fg=#006600]│ #[bold,fg=#00ff00]%H:%M #[fg=#006600]// #[fg=#39ff14]%Y-%m-%d "
set -g window-status-style "bg=#000000,fg=#00b300"
set -g window-status-format " #I:#W "
set -g window-status-current-style "bold,bg=#00ff00,fg=#000000"
set -g window-status-current-format " #I:#W#{?window_zoomed_flag,[Z],} "
set -g window-status-last-style "bg=#000000,fg=#39ff14"
set -g window-status-activity-style "bold,bg=#006600,fg=#b6ff00"
set -g window-status-bell-style "bold,bg=#ffffff,fg=#000000"
set -g pane-border-style "fg=#006600"
set -g pane-active-border-style "fg=#39ff14"
set -g message-style "bg=#00ff00,fg=#000000"
set -g message-command-style "bold,bg=#000000,fg=#39ff14"
set -g mode-style "bold,bg=#00ff00,fg=#000000"
set -g clock-mode-colour "#b6ff00"
set -g display-panes-colour "#00b300"
set -g display-panes-active-colour "#ffffff"
# Vim-style pane navigation
bind -r h select-pane -L
bind -r j select-pane -D
bind -r k select-pane -U
bind -r l select-pane -R

# btop
bind-key i display-popup -w 80% -h 80% -E btop

# journal
bind-key W display-popup -w 80% -h 80% -E tmux new -A -s jour -c ~/source/jour 'just day'

# scratchpad
bind-key S display-popup -w 80% -h 80% -E tmux new -A -s scratch -c ~/source/ 'vi scratchpad'

# reload config
bind-key r source-file ~/.tmux.conf

# tmux popup
bind-key Enter display-popup -w 80% -h 80% -E -d ~/source 'tmux new -A -s HUD'

# Plugins
set-environment -g TMUX_PLUGIN_MANAGER_PATH '~/.tmux/plugins'
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-pain-control'
set -g @plugin 'bjesus/muxile'

run '~/.tmux/plugins/tpm/tpm'
