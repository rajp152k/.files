setupVersion: 1
modelRoles: 
  default: openai-codex/gpt-5.5
  task: openai-codex/gpt-5.5:low
  plan: openai-codex/gpt-5.5:xhigh
defaultThinkingLevel: auto
symbolPreset: nerd
theme: 
  dark: bit-mage
  light: bit-mage
hideThinkingBlock: false
statusLine: 
  separator: powerline-thin
  preset: default
  sessionAccent: true
  transparent: true
  showHookStatus: true
tui: 
  textSizing: true
  hyperlinks: auto
display: 
  shimmer: kitt
  smoothStreaming: true
  showTokenUsage: true
showHardwareCursor: true
task: 
  showResolvedModelBadge: true
  eager: always
  maxConcurrency: 8
  enableLsp: true
  maxRuntimeMs: 300000
  softRequestBudget: 40
  isolation: 
    mode: auto
    merge: branch
    commits: ai
personality: pragmatic
steeringMode: one-at-a-time
interruptMode: immediate
loop: 
  mode: prompt
doubleEscapeAction: tree
treeFilterMode: default
autocompleteMaxVisible: 10
emojiAutocomplete: true
tools: 
  approvalMode: yolo
  discoveryMode: auto
ask: 
  timeout: 60
  notify: "on"
stt: 
  enabled: true
  modelName: base.en
startup: 
  quiet: true
autoResume: true
power: 
  preventSystemSleep: true
  declareUserActive: true
  preventDisplaySleep: true
contextPromotion: 
  enabled: false
branchSummary: 
  enabled: true
compaction: 
  enabled: true
  strategy: context-full
  thresholdPercent: 70
  thresholdTokens: -1
  handoffSaveToDisk: false
  idleEnabled: true
  supersedeReads: true
  idleTimeoutSeconds: 300
ttsr: 
  contextMode: keep
  interruptMode: never
  repeatMode: once
  builtinRules: true
memory: 
  backend: mnemopi
mnemopi: 
  enhancedRecall: true
  polyphonicRecall: true
edit: 
  mode: hashline
  blockAutoGenerated: false
readLineNumbers: true
read: 
  toolResultPreview: true
  summarize: 
    prose: true
lsp: 
  formatOnWrite: true
  diagnosticsOnEdit: true
bash: 
  autoBackground: 
    enabled: true
bashInterceptor: 
  enabled: true
shellMinimizer: 
  sourceOutlineLevel: default
eval: 
  py: true
python: 
  kernelMode: session
renderMermaid: 
  enabled: true
inspect_image: 
  enabled: true
checkpoint: 
  enabled: true
github: 
  enabled: true
todo: 
  eager: default
browser: 
  headless: true
irc: 
  timeoutMs: 60000
mcp: 
  discoveryMode: true
  notifications: true
exa: 
  enableResearcher: true
  enableWebsets: true
secrets: 
  enabled: true
dev: 
  autoqa: 
    consent: granted